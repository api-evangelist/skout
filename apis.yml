aid: skout
name: Skout
description: >-
  Skout is a location-based social discovery and dating mobile app that lets
  people meet, chat, and make connections with others nearby or worldwide.
  Operated by the ParshipMeet Group, Skout is distributed as consumer iOS and
  Android applications and an in-browser experience, and was an early a16z
  portfolio company. It is a consumer product with no public developer program,
  API documentation, SDKs, or API surface; this profile captures its public
  identity and published legal/support pages. Added to the API Evangelist network
  as a stub for enrichment.
